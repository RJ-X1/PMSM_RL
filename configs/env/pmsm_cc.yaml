# Default to the custom paper-style dq current-control environment.
# Switch `use_custom_env` to false to route back through the legacy GEM builder.
use_custom_env: true
env_id: Custom-PMSM-Current-v0
seed: 0

# Lightweight custom PMSM motor model parameters.
motor:
  p: 4
  Rs: 0.35
  Ld: 2.8e-3
  Lq: 3.2e-3
  psi_f: 0.095
  J: 1.2e-3
  B: 1.5e-4
  Vdc: 300.0
  Umax: 173.0
  Imax: 20.0
  Ts: 1.0e-4

environment:
  episode_steps: 2000
  init_i_d_range: [0.0, 0.0]
  init_i_q_range: [0.0, 0.0]
  init_omega_m_range: [0.0, 0.0]
  load_torque: 0.0
  load_torque_range: [0.0, 0.0]

reference:
  ref_i_d: 0.0
  ref_i_q: 10.0
  randomize_on_reset: false
  ref_i_d_range: [0.0, 0.0]
  ref_i_q_range: [10.0, 10.0]

noise:
  observation_noise_std: 0.0
  process_noise_std: 0.0

termination:
  terminate_on_overcurrent: true
  current_limit: 24.0
  current_limit_factor: 1.2
  terminate_on_nonfinite: true

reward:
  mode: vanilla_td3_reward
  w_ed: 0.40
  w_eq: 0.40
  w_u: 0.08
  w_da: 0.07
  w_lim: 0.05

action_smoothness:
  enabled: true
  weight: 0.07

domain_randomization:
  enabled: false
  rs_scale_range: [1.0, 1.0]
  ld_scale_range: [1.0, 1.0]
  lq_scale_range: [1.0, 1.0]
  psi_f_scale_range: [1.0, 1.0]
  j_scale_range: [1.0, 1.0]
  vdc_scale_range: [1.0, 1.0]
  sigma_i_range: [0.0, 0.0]
  sigma_omega_rpm_range: [0.0, 0.0]
  load_torque_range: [0.0, 0.0]
  load_change_interval_steps_range: [0, 0]

# Legacy GEM path configuration. This block is still used when
# `use_custom_env: false`.
gem_kwargs:
  visualization: null
