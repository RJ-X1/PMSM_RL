algorithm: td3
algo: td3
run_name: gun_servo_mc_sc_residual_td3_random_v8_full_seed0
output_dir: outputs
device: cpu
seed: 0

controller_mode: residual
residual_control:
  enabled: true
  baseline_controller: pid
  residual_action_scale_deg_s: 3.0
  baseline_weight: 1.0
  residual_weight: 1.0
  residual_action_clip: 1.0

initial_checkpoint: outputs/runs/gun_servo_mc_sc_residual_td3_smoke_v7/checkpoints/checkpoint_best.pt
apply_domain_randomization: true

train_scenarios:
  - random_step_safe
  - random_trapezoid_safe
  - random_sine_safe
  - random_disturbance_after_settling

train_scenario_weights:
  random_step_safe: 0.30
  random_trapezoid_safe: 0.25
  random_sine_safe: 0.25
  random_disturbance_after_settling: 0.20

eval_config: configs/eval/gun_servo_mc_sc_residual_td3_random_v8_full_seed0_eval_fixed.yaml
eval_scenario: C1_10deg_step
eval_metric: rmse_theta
best_checkpoint_metric: rmse_theta

total_steps: 600000
max_episode_steps: 5000
max_steps_per_episode: 5000
replay_size: 100000
replay_capacity: 100000
batch_size: 128
start_steps: 10000
warmup_steps: 10000
update_after: 10000

gamma: 0.99
tau: 0.005
actor_lr: 1.0e-4
critic_lr: 1.0e-3
lr_actor: 1.0e-4
lr_critic: 1.0e-3
hidden_dim: 128

policy_noise: 0.05
target_policy_noise: 0.05
noise_clip: 0.15
target_noise_clip: 0.15
policy_delay: 2
exploration_noise: 0.04

eval_interval: 20000
eval_every_steps: 20000
eval_episodes: 1
save_interval: 20000
save_every_steps: 20000
log_every_steps: 1000
