algo: td3
run_name: td3_gun_position_smoke
output_dir: outputs
device: cpu
seed: 0

total_steps: 2000
max_steps_per_episode: 500
replay_capacity: 20000
batch_size: 64
warmup_steps: 200
update_after: 100

gamma: 0.99
tau: 0.005
lr_actor: 0.0001
lr_critic: 0.001
hidden_dim: 128

exploration_noise: 0.10
target_policy_noise: 0.20
target_noise_clip: 0.50
policy_delay: 2

eval_every_steps: 1000
eval_episodes: 1
eval_config: configs/eval/gun_servo_eval.yaml
eval_scenario: step_10deg
eval_metric: rmse_theta
best_checkpoint_metric: rmse_theta
save_every_steps: 1000
log_every_steps: 100
