algo: td3
run_name: td3_gun_position_main
output_dir: outputs
device: cpu
seed: 0

total_steps: 1000000
max_steps_per_episode: 3000
replay_capacity: 300000
batch_size: 256
warmup_steps: 10000
update_after: 5000

gamma: 0.99
tau: 0.005
lr_actor: 0.0001
lr_critic: 0.001
hidden_dim: 256

exploration_noise: 0.10
exploration_noise_final: 0.03
exploration_noise_decay_steps: 300000
target_policy_noise: 0.20
target_noise_clip: 0.50
policy_delay: 2

eval_every_steps: 25000
eval_episodes: 5
eval_config: configs/eval/gun_servo_eval.yaml
eval_scenario: step_10deg
eval_metric: rmse_theta
best_checkpoint_metric: rmse_theta
save_every_steps: 25000
log_every_steps: 5000
