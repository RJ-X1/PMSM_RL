algo: td3
run_name: cdr_td3_dr_main
output_dir: outputs
device: cpu

total_steps: 500000
replay_capacity: 300000
batch_size: 256
warmup_steps: 10000
update_after: 10000
max_steps_per_episode: 2000

gamma: 0.99
tau: 0.005
lr_actor: 0.0001
lr_critic: 0.001
hidden_dim: 256

exploration_noise: 0.08
target_policy_noise: 0.12
target_noise_clip: 0.25
policy_delay: 2

eval_every_steps: 25000
eval_episodes: 5
save_every_steps: 25000
log_every_steps: 5000

reward:
  mode: constraint_aware_reward
  w_ed: 0.40
  w_eq: 0.40
  w_u: 0.08
  w_da: 0.07
  w_lim: 0.05

domain_randomization:
  enabled: true
  rs_scale_range: [0.8, 1.2]
  ld_scale_range: [0.8, 1.2]
  lq_scale_range: [0.8, 1.2]
  psi_f_scale_range: [0.9, 1.1]
  j_scale_range: [0.7, 1.3]
  vdc_scale_range: [0.9, 1.1]
  sigma_i_range: [0.0, 0.15]
  sigma_omega_rpm_range: [0.0, 8.0]
  load_torque_range: [0.0, 3.0]
  load_change_interval_steps_range: [100, 400]
