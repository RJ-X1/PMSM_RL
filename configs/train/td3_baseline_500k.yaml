# Ablation: Vanilla TD3 baseline.
# Active components: TD3 only.
algo: td3
run_name: td3_baseline_500k
output_dir: outputs
device: cpu

total_steps: 500000
replay_capacity: 300000
batch_size: 256
warmup_steps: 10000
update_after: 10000
max_steps_per_episode: 2000

gamma: 0.99
tau: 0.005
lr_actor: 0.0001
lr_critic: 0.001
hidden_dim: 256

# Slightly conservative noise settings based on the successful pretraining check.
exploration_noise: 0.08
target_policy_noise: 0.12
target_noise_clip: 0.25
policy_delay: 2

eval_every_steps: 25000
eval_episodes: 5
save_every_steps: 25000
log_every_steps: 5000
