  random_trapezoid_safe: 0.25
  random_sine_safe: 0.25
  random_disturbance_after_settling: 0.20

scenario_condition_map:
  random_step_safe: random_step_safe_v8
  random_trapezoid_safe: random_trapezoid_safe_v8
