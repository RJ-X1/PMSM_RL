env_config: configs/env/gun_servo_position_mc_sc_residual_td3_v8_rand.yaml
train_config: configs/train/gun_servo_mc_sc_residual_td3_random_v8_full_seed2.yaml
test_conditions: configs/eval/gun_servo_test_conditions.yaml
test_conditions_path: configs/eval/gun_servo_test_conditions.yaml
max_steps: 5000
seed: 10008
