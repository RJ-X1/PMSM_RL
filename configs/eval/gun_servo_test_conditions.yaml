test_scenarios:
  - id: small_angle_step_tracking
    name: Small-angle step tracking
    reference:
      profile: step
      theta_range_deg: [0.0, 5.0]
      step_time_s: 0.2
      randomize_on_reset: false
    disturbance_torque_Nm: 0.0

  - id: large_angle_trapezoidal_tracking
    name: Large-angle trapezoidal tracking
    reference:
      profile: trapezoid
      theta_range_deg: [-20.0, 25.0]
      max_speed_deg_s: 55.0
      max_accel_deg_s2: 180.0
      step_time_s: 0.1
      randomize_on_reset: false
    disturbance_torque_Nm: 0.0

  - id: sinusoidal_tracking
    name: Sinusoidal tracking
    reference:
      profile: sinusoidal
      theta_range_deg: [-10.0, 10.0]
      sine_frequency_hz: 0.2
      randomize_on_reset: false
    disturbance_torque_Nm: 0.0

  - id: load_disturbance_rejection
    name: Load disturbance rejection
    reference:
      profile: step
      theta_range_deg: [0.0, 8.0]
      step_time_s: 0.2
      randomize_on_reset: false
    disturbance_torque_Nm: 12.0

  - id: inertia_friction_mismatch_robustness
    name: Inertia/friction mismatch robustness test
    reference:
      profile: trapezoid
      theta_range_deg: [-15.0, 15.0]
      max_speed_deg_s: 45.0
      max_accel_deg_s2: 150.0
      randomize_on_reset: false
    domain_randomization:
      enabled: true
      J_load_scale_range: [1.3, 1.5]
      B_load_scale_range: [1.2, 1.5]
      friction_scale_range: [1.3, 1.8]
      gravity_torque_scale_range: [1.1, 1.3]
      disturbance_torque_range: [-10.0, 10.0]
      encoder_noise_deg_range: [0.02, 0.05]
