test_scenarios:
  - id: step_10deg
    name: Step 10 deg
    reference:
      profile: step
      theta_range_deg: [0.0, 10.0]
      step_time_s: 0.1
      randomize_on_reset: false
    load:
      disturbance_torque_nm: 0.0
      disturbance_step_nm: 0.0
      disturbance_noise_std_nm: 0.0
    domain_randomization:
      enabled: false

  - id: step_20deg
    name: Step 20 deg
    reference:
      profile: step
      theta_range_deg: [0.0, 20.0]
      step_time_s: 0.1
