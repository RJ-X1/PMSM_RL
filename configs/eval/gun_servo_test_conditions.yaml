      disturbance_torque_nm: 0.0
      disturbance_step_nm: 0.0
      disturbance_noise_std_nm: 0.0
    domain_randomization:
      enabled: false

  - id: C1_mixed_5_10deg_step_sc_residual_td3_v5
    name: SC-residual TD3 v5 mixed 5 to 10 deg training step
    episode_time_s: 5.0
    reference:
      profile: random_step
      theta_range_deg: [0.0, 10.0]
      theta_initial_range_deg: [0.0, 0.0]
      theta_final_range_deg: [5.0, 10.0]
      step_time_s: 0.1
      randomize_on_reset: true
    rl_controller:
      delta_omega_limit_deg_s: 30.0
      omega_limit_deg_s: 30.0
      delta_omega_rate_limit_deg_s2: 600.0
      omega_cmd_accel_limit_deg_s2: 150.0
      command_smoothing_time_s: 0.0
      baseline_pid:
        kp: 8.0
        ki: 0.0
        kd: 2.0
    reward:
      mode: quadratic_tracking
      w_theta: 8.0
      w_omega: 0.05
      w_action: 0.02
      action_rate_weight: 0.02
      residual_action_weight: 0.01
      w_torque: 0.02
      w_safety: 100.0
      w_progress: 3.0
      w_speed_limit: 2.0
      speed_margin_weight: 2.0
      command_speed_margin_weight: 0.75
      speed_limit_soft_ratio: 0.85
      safety_flag_u_weight: 0.15
      safety_flag_e_weight: 0.2
      command_saturation_weight: 0.3
      w_saturation: 0.3
      unsafe_done_weight: 100.0
      w_terminal: 100.0
    safety:
      enable_u_safe: true
      enable_e_safe: true
      enable_x_safe: true
      lambda_smooth: 0.8
      safety_penalty: 100.0
    load:
      disturbance_torque_nm: 0.0
      disturbance_step_nm: 0.0
      disturbance_noise_std_nm: 0.0
    domain_randomization:
      enabled: false

