# Paper-style dq-axis PI baseline defaults for the custom PMSM environment.

kp_d: 8.80
ki_d: 1099.0
kp_q: 10.05
ki_q: 1099.0

# Integral contribution limits in volts.
integrator_limit_d: 120.0
integrator_limit_q: 120.0

# Use the environment motor Umax when null.
voltage_limit: null
action_limit: 1.0

# Options: clamping, clamp, conditional_integration, none
anti_windup: clamping

use_resistance_compensation: true
use_decoupling: true
use_back_emf_compensation: true

# Legacy GEM epsilon -> electrical-angle scaling.
epsilon_scale: 3.141592653589793
