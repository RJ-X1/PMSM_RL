[project]
name = "pmsm-rl-current-control"
version = "0.1.0"
description = "Reinforcement learning current control for PMSM (gym-electric-motor + DDPG)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gym-electric-motor>=3.0.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "torch>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["envs*", "agents*", "baselines*", "utils*", "scripts*"]
